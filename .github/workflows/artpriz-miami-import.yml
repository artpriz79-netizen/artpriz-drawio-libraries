name: ArtPriz Miami import
on:
  push:
    paths:
      - '.artpriz-import/trigger-miami-20261023.txt'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add Miami components
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          target = Path("libraries/09-КОМПЛЕКТУЮЧІ.xml")
          xml = target.read_text(encoding="utf-8")
          prefix, suffix = "<mxlibrary>", "</mxlibrary>"
          if not (xml.startswith(prefix) and xml.endswith(suffix)):
              raise SystemExit("Invalid mxlibrary wrapper")
          arr = json.loads(xml[len(prefix):-len(suffix)])

          specs = [
              ("Серединка МАЙАМИ №1 H166mm D64mm Gold Red.png", ".artpriz-import/miami1.b64"),
              ("Серединка МАЙАМИ №2 H141mm D54mm Gold Red.png", ".artpriz-import/miami2.b64"),
              ("Серединка МАЙАМИ №3 H116mm D44mm Gold Red – копія.png", ".artpriz-import/miami3.b64"),
          ]

          for title, p in specs:
              b64 = Path(p).read_text(encoding="utf-8").strip()
              item = {
                  "data": "data:image/png;base64," + b64,
                  "w": 500,
                  "h": 500,
                  "title": title,
                  "aspect": "fixed",
              }
              idx = next((i for i, x in enumerate(arr) if x.get("title") == title), None)
              if idx is None:
                  arr.append(item)
              else:
                  arr[idx] = item

          target.write_text(prefix + json.dumps(arr, ensure_ascii=False, separators=(",", ":")) + suffix, encoding="utf-8")

          for _, p in specs:
              Path(p).unlink(missing_ok=True)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "libraries/09-КОМПЛЕКТУЮЧІ.xml" .artpriz-import/miami1.b64 .artpriz-import/miami2.b64 .artpriz-import/miami3.b64
          git commit -m "Add 3 Miami components to КОМПЛЕКТУЮЧІ"
          git push
