name: One-time ArtPriz library item cleanup
on:
  push:
    paths:
      - ".github/workflows/one-time-remove-cap-20261010.yml"
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Remove exact component and self-clean
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path("libraries/09-КОМПЛЕКТУЮЧІ.xml")
          s = p.read_text(encoding="utf-8")
          prefix, suffix = "<mxlibrary>", "</mxlibrary>"
          assert s.startswith(prefix) and s.endswith(suffix), "Unexpected library format"
          entries = json.loads(s[len(prefix):-len(suffix)])
          target = "Блискучий золотий декоративний ковпачок.png"
          assert sum(x.get("title")==target for x in entries)==1, "Expected exactly one matching element"
          entries = [x for x in entries if x.get("title") != target]
          p.write_text(prefix+json.dumps(entries,ensure_ascii=False,separators=(",",":"))+suffix,encoding="utf-8")
          Path(".github/workflows/one-time-remove-cap-20261010.yml").unlink()
          print("Removed exact target; remaining elements:",len(entries))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "libraries/09-КОМПЛЕКТУЮЧІ.xml" ".github/workflows/one-time-remove-cap-20261010.yml"
          git commit -m "Remove golden decorative cap from components library"
          git push
