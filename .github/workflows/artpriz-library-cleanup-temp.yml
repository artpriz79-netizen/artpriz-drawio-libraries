name: Temporary ArtPriz library cleanup
on:
  push:
    paths:
      - ".github/workflows/artpriz-library-cleanup-temp.yml"
permissions:
  contents: write
jobs:
  remove-selected-items:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove exactly two selected items
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("libraries/09-КОМПЛЕКТУЮЧІ.xml")
          raw=p.read_text(encoding="utf-8")
          start,end="<mxlibrary>","</mxlibrary>"
          assert raw.startswith(start) and raw.endswith(end)
          entries=json.loads(raw[len(start):-len(end)])
          targets={"Золотий рифлений декоративний ковпачок.png","Розкішний золотий геометричний кубок.png"}
          assert {x.get("title") for x in entries if x.get("title") in targets} == targets, "Some targets missing"
          assert all(sum(x.get("title")==t for x in entries)==1 for t in targets), "Unexpected duplicates"
          new=[x for x in entries if x.get("title") not in targets]
          assert len(new)==len(entries)-2
          p.write_text(start+json.dumps(new,ensure_ascii=False,separators=(",",":"))+end,encoding="utf-8")
          print("Before:",len(entries),"After:",len(new),"Removed:",sorted(targets))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "libraries/09-КОМПЛЕКТУЮЧІ.xml"
          git diff --cached --quiet || (git commit -m "Remove two unwanted ArtPriz component entries" && git push)
