name: ArtPriz split library 09
on:
  push:
    paths:
      - '.artpriz-import/trigger-split-09-20261023.txt'

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Split library 09 and update constructor
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          p1 = Path("libraries/09-КОМПЛЕКТУЮЧІ.xml")
          p2 = Path("libraries/09-КОМПЛЕКТУЮЧІ-2.xml")
          index = Path("index.html")

          xml = p1.read_text(encoding="utf-8")
          prefix, suffix = "<mxlibrary>", "</mxlibrary>"
          if not (xml.startswith(prefix) and xml.endswith(suffix)):
              raise SystemExit("Invalid mxlibrary wrapper")
          arr = json.loads(xml[len(prefix):-len(suffix)])

          miami_titles = [
              "Серединка МАЙАМИ №1 H166mm D64mm Gold Red.png",
              "Серединка МАЙАМИ №2 H141mm D54mm Gold Red.png",
              "Серединка МАЙАМИ №3 H116mm D44mm Gold Red – копія.png",
          ]
          miami_map = {x.get("title"): x for x in arr if x.get("title") in miami_titles}
          missing = [t for t in miami_titles if t not in miami_map]
          if missing:
              raise SystemExit("Missing Miami items: " + repr(missing))

          regular = [x for x in arr if x.get("title") not in miami_titles]
          cut = (len(regular) + 1) // 2
          part1 = regular[:cut]
          part2 = regular[cut:] + [miami_map[t] for t in miami_titles]

          def dump(items):
              return prefix + json.dumps(items, ensure_ascii=False, separators=(",", ":")) + suffix

          p1.write_text(dump(part1), encoding="utf-8")
          p2.write_text(dump(part2), encoding="utf-8")

          html = index.read_text(encoding="utf-8")
          old_url = "https://raw.githubusercontent.com/artpriz79-netizen/artpriz-drawio-libraries/main/libraries/09-КОМПЛЕКТУЮЧІ.xml"
          new_url = "https://raw.githubusercontent.com/artpriz79-netizen/artpriz-drawio-libraries/main/libraries/09-КОМПЛЕКТУЮЧІ-2.xml"
          if new_url not in html:
              if old_url not in html:
                  raise SystemExit("Library 09 URL not found in index.html")
              html = html.replace(f'"{old_url}"', f'"{old_url}","{new_url}"', 1)
          index.write_text(html, encoding="utf-8")

          print(json.dumps({
              "original_total": len(arr),
              "part1": len(part1),
              "part2": len(part2),
              "miami_in_part2": [x["title"] for x in part2 if x.get("title") in miami_titles]
          }, ensure_ascii=False))
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "libraries/09-КОМПЛЕКТУЮЧІ.xml" "libraries/09-КОМПЛЕКТУЮЧІ-2.xml" index.html
          git commit -m "Split КОМПЛЕКТУЮЧІ library into two parts"
          git push
