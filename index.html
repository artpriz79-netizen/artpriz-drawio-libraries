<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>АРТПРИЗ КОНСТРУКТОР</title>
  <style>
    body{font-family:Arial,sans-serif;background:#111827;color:#f9fafb;margin:0;display:grid;place-items:center;min-height:100vh}
    .box{max-width:620px;padding:36px;text-align:center}
    h1{margin:0 0 14px;font-size:34px}
    p{color:#cbd5e1;line-height:1.5}
    a{display:inline-block;margin-top:18px;padding:12px 20px;border-radius:10px;background:#f59e0b;color:#111827;text-decoration:none;font-weight:700}
    small{display:block;margin-top:18px;color:#94a3b8}
  </style>
</head>
<body>
  <div class="box">
    <h1>🏆 АРТПРИЗ КОНСТРУКТОР</h1>
    <p>Открываем конструктор кубков с библиотеками ArtPriz.</p>
    <a id="open" href="#">Открыть конструктор</a>
    <small>Доступ по ссылке. Вход через почту не требуется.</small>
  </div>
<script>
  const libraries=[
    "https://raw.githubusercontent.com/artpriz79-netizen/artpriz-drawio-libraries/main/libraries/01-fony.xml?v=20261031-1154",
    "https://raw.githubusercontent.com/artpriz79-netizen/artpriz-drawio-libraries/main/libraries/02-ДЕТАЛІ НА ПІДСТАВКУ.xml?v=20261031-1154",
    "https://raw.githubusercontent.com/artpriz79-netizen/artpriz-drawio-libraries/main/libraries/03-ЧАШИ.xml?v=20261031-1154",
    "https://raw.githubusercontent.com/artpriz79-netizen/artpriz-drawio-libraries/main/libraries/04-МІНІКУБКІ.xml?v=20261031-1154",
    "https://raw.githubusercontent.com/artpriz79-netizen/artpriz-drawio-libraries/main/libraries/05-ОСНОВИ.xml?v=20261031-1154",
    "https://raw.githubusercontent.com/artpriz79-netizen/artpriz-drawio-libraries/main/libraries/06-ФІГУРКІ.xml?v=20261031-1154",
    "https://raw.githubusercontent.com/artpriz79-netizen/artpriz-drawio-libraries/main/libraries/Ножки на основу?v=20261031-1154",
    "https://raw.githubusercontent.com/artpriz79-netizen/artpriz-drawio-libraries/main/libraries/07-detalki.xml?v=20261031-1154",
    "https://raw.githubusercontent.com/artpriz79-netizen/artpriz-drawio-libraries/main/libraries/08-troyki-a.xml?v=20261031-1154",
    "https://raw.githubusercontent.com/artpriz79-netizen/artpriz-drawio-libraries/main/libraries/09-КОМПЛЕКТУЮЧІ.xml?v=20261031-1154",
    "https://raw.githubusercontent.com/artpriz79-netizen/artpriz-drawio-libraries/main/libraries/09-КОМПЛЕКТУЮЧІ-2.xml?v=20261031-1154",
    "https://raw.githubusercontent.com/artpriz79-netizen/artpriz-drawio-libraries/main/libraries/09-КОМПЛЕКТУЮЧІ-3.xml?v=20261031-1154",
    "https://raw.githubusercontent.com/artpriz79-netizen/artpriz-drawio-libraries/main/libraries/09-КОМПЛЕКТУЮЧІ-4.xml?v=20261031-1154",
    "https://raw.githubusercontent.com/artpriz79-netizen/artpriz-drawio-libraries/main/libraries/09-КОМПЛЕКТУЮЧІ-5.xml?v=20261031-1154",
    "https://raw.githubusercontent.com/artpriz79-netizen/artpriz-drawio-libraries/main/libraries/09-КОМПЛЕКТУЮЧІ-6.xml?v=20261031-1154",
    "https://raw.githubusercontent.com/artpriz79-netizen/artpriz-drawio-libraries/main/ФОНИ.xml?v=20261031-1154"
  ];
  const clibs=libraries.map(u=>'U'+encodeURIComponent(u)).join(';');
  const title='АРТПРИЗ КОНСТРУКТОР';
  const template='<mxGraphModel><root><mxCell id="0"/><mxCell id="1" parent="0"/></root></mxGraphModel>';
  const target='https://app.diagrams.net/?splash=0&libs=0&mode=device&clibs='+clibs
    +'&title='+encodeURIComponent(title)+'#R'+encodeURIComponent(template);
  const a=document.getElementById('open');
  a.href=target;
  setTimeout(()=>location.replace(target),500);
</script>
</body>
</html>
